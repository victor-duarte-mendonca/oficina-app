# ===================================================
# Aplicação
# ===================================================
quarkus.application.name=oficina-mecanica
quarkus.http.port=8080

# ===================================================
# Banco de Dados (Produção - PostgreSQL)
# ===================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USERNAME:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:oficina_db}
quarkus.datasource.jdbc.max-size=20

# ===================================================
# Hibernate ORM
# ===================================================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.log.format-sql=false

# ===================================================
# Flyway
# ===================================================
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0

# ===================================================
# JWT - SmallRye
# ===================================================
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:keys/publicKey.pem}
mp.jwt.verify.issuer=${JWT_ISSUER:oficina-api}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:keys/privateKey.pem}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# ===================================================
# Seed inicial de usuários
# Em produção: defina APP_SEED_ADMIN_PASSWORD / APP_SEED_MECHANIC_PASSWORD
# ou desabilite com APP_SEED_ENABLED=false após primeira execução
# ===================================================
app.seed.enabled=${APP_SEED_ENABLED:true}
app.seed.admin-username=${APP_SEED_ADMIN_USERNAME:admin}
app.seed.admin-password=${APP_SEED_ADMIN_PASSWORD:}
app.seed.mechanic-username=${APP_SEED_MECHANIC_USERNAME:mecanico}
app.seed.mechanic-password=${APP_SEED_MECHANIC_PASSWORD:}

# ===================================================
# OpenAPI / Swagger UI
# ===================================================
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui
quarkus.smallrye-openapi.path=/openapi
quarkus.smallrye-openapi.info-title=Oficina Mecânica API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-contact-name=Equipe SOAT

# ===================================================
# CORS
# ===================================================
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.exposed-headers=Location,X-Total-Count

# ===================================================
# Mailer (notificações de mudança de status da OS)
# Dev/test: mock=true por padrão (e-mails capturados, não enviados).
# Docker (Mailpit): envia de fato para o container, visível em http://localhost:8025
# Cloud: host/porta/credenciais via Secret (etapa Kubernetes)
# ===================================================
quarkus.mailer.from=${MAILER_FROM:nao-responda@oficina.local}
quarkus.mailer.host=${MAILER_HOST:localhost}
quarkus.mailer.port=${MAILER_PORT:1025}
quarkus.mailer.start-tls=${MAILER_START_TLS:DISABLED}

%docker.quarkus.mailer.mock=false
%docker.quarkus.mailer.host=${MAILER_HOST:mailpit}
%docker.quarkus.mailer.port=${MAILER_PORT:1025}

# ===================================================
# Jackson
# ===================================================
quarkus.jackson.serialization-inclusion=non_null
quarkus.jackson.write-dates-as-timestamps=false

# ===================================================
# Observabilidade
# Métricas Prometheus em /q/metrics — é a fonte que o HPA (via Prometheus
# Adapter) ou um dashboard consumiria; o metrics-server do k3s, usado pelo HPA
# hoje, é independente disto e mede CPU/memória do container.
# ===================================================
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.micrometer.binder.system=true

# ===================================================
# Logging
# ===================================================
quarkus.log.level=INFO
quarkus.log.category."br.com.oficina".level=DEBUG

# ===================================================
# PERFIL: prod (hardening de segurança - deploy real)
# ===================================================
%prod.quarkus.swagger-ui.always-include=false
%prod.quarkus.smallrye-openapi.enable=false
%prod.quarkus.log.category."br.com.oficina".level=INFO
%prod.quarkus.hibernate-orm.log.sql=false
# Log estruturado só em prod: com múltiplas réplicas, o stdout vira uma stream
# única e texto livre é impossível de correlacionar. Em dev/docker o formato
# legível continua valendo mais.
%prod.quarkus.log.console.json=true

# ===================================================
# PERFIL: docker (docker-compose local / demonstração)
# Herda prod mas mantém Swagger acessível
# ===================================================
%docker.quarkus.swagger-ui.always-include=true
%docker.quarkus.smallrye-openapi.enable=true
%docker.quarkus.log.category."br.com.oficina".level=INFO
%docker.quarkus.hibernate-orm.log.sql=false

# ===================================================
# PERFIL: test (H2 em memória)
# ===================================================
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;NON_KEYWORDS=YEAR
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.hibernate-orm.log.sql=false
%test.quarkus.flyway.migrate-at-start=true
%test.quarkus.flyway.baseline-on-migrate=true
%test.mp.jwt.verify.publickey.location=test-keys/publicKey.pem
%test.smallrye.jwt.sign.key.location=test-keys/privateKey.pem
%test.mp.jwt.verify.issuer=oficina-api
%test.app.seed.admin-password=admin123
%test.app.seed.mechanic-password=mecanico123

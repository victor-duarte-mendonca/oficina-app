name: CI

# E0 (spec 08): build, testes e imagem em todo PR/push. O deploy (ECR, kustomize, rollback, smoke test)
# está em deploy.yml, por ambiente.
on:
  push:
    branches: [main, homolog]
  pull_request:
    branches: [main, homolog]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: mvn verify (testes + gate JaCoCo)
        run: mvn -B --no-transfer-progress verify
      - name: Publicar relatório de testes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/
          retention-days: 7
      - name: Publicar relatório de cobertura
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7

  docker-build:
    name: docker-build
    needs: [build-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: oficina-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan da imagem (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: oficina-app:${{ github.sha }}
          format: table
          exit-code: "1"
          # Só CRITICAL com correção disponível: gate que falha sem patch vira ruído.
          severity: CRITICAL
          ignore-unfixed: true

  # Lint dos workflows, dos scripts e dos manifestos. Não é check obrigatório: protege o que o deploy
  # usa (um erro aqui só apareceria no primeiro deploy, que depende de uma sessão AWS ativa).
  workflow-lint:
    name: workflow-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest
      - name: shellcheck dos scripts
        run: shellcheck scripts/*.sh
      - name: kustomize dos overlays
        run: |
          for env in hml prod; do
            kubectl kustomize "k8s/overlays/${env}" > "/tmp/${env}.yaml"
          done
          # O Secret nunca pode voltar aos resources: cada `apply -k` o sobrescreveria com placeholders.
          if grep -q '^kind: Secret' /tmp/hml.yaml /tmp/prod.yaml; then
            echo "::error::Secret encontrado na saída do kustomize (k8s/base/secret.example.yaml deve ficar fora dos resources)"
            exit 1
          fi

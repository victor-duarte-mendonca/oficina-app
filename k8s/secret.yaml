# Placeholders — nenhum valor real commitado. Valores de verdade entram via
# `kubectl create secret --dry-run=client -o yaml | kubectl apply -f -` (ver README de deploy),
# nunca editando este arquivo com dados reais.
#
# JWT_PUBLIC_KEY_LOCATION/JWT_PRIVATE_KEY_LOCATION NÃO aparecem aqui de propósito: o
# docker-entrypoint.sh do container sempre aponta para /app/keys/*.pem, que é montado via o Secret
# separado `oficina-jwt-keys` (volume, não env var) — ver deployment.yaml. Isso é o que garante que
# todas as réplicas usem o MESMO par de chaves (senão cada pod geraria uma chave própria e tokens
# emitidos por um pod seriam inválidos nos outros).
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secrets
  namespace: oficina
type: Opaque
stringData:
  DB_HOST: "CHANGE_ME_RDS_ENDPOINT"
  DB_USERNAME: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  MAILER_HOST: "CHANGE_ME_SMTP_HOST"
  MAILER_USERNAME: "CHANGE_ME"
  MAILER_PASSWORD: "CHANGE_ME"
  APP_SEED_ADMIN_PASSWORD: "CHANGE_ME"
  APP_SEED_MECHANIC_PASSWORD: "CHANGE_ME"

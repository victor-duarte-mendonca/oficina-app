apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Homologação (t3.small, 2 GiB): 1-2 réplicas e seed de usuários ligado para a demonstração.
resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: oficina-config
        namespace: oficina
      data:
        APP_ENV: "hml"
        OTEL_TRACES_SAMPLER_ARG: "1.0"
        APP_SEED_ENABLED: "true"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: oficina-app
        namespace: oficina
      spec:
        replicas: 1
  - patch: |-
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: oficina-hpa
        namespace: oficina
      spec:
        minReplicas: 1
        maxReplicas: 2

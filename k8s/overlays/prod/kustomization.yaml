apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Produção: 2-4 réplicas (valores da base).
# Seed LIGADO só para a sessão de validação em produção (docs/VALIDACAO-PROD.md, D1): sem um admin o smoke
# test autenticado e o fluxo do cliente pelo gateway são pulados. REVERTER para "false" depois da gravação do vídeo.
resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: oficina-config
        namespace: oficina
      data:
        APP_ENV: "prod"
        APP_SEED_ENABLED: "true"

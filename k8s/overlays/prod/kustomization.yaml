apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Produção: 2-4 réplicas (valores da base). Seed de usuários desligado.
resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: oficina-config
        namespace: oficina
      data:
        APP_ENV: "prod"
        APP_SEED_ENABLED: "false"

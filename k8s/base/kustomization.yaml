apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base = valores de produção. Os overlays (hml, prod) sobrescrevem só o que muda por ambiente:
# réplicas/HPA, ConfigMap (seed, nome do ambiente) e, no pipeline, a imagem.
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - networkpolicy.yaml

# A tag/repositório reais entram no deploy:
#   kustomize edit set image CHANGE_ME_ECR_REPOSITORY_URL=<ecr_repository_url>:<sha>
images:
  - name: CHANGE_ME_ECR_REPOSITORY_URL

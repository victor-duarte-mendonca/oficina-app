apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: oficina
data:
  QUARKUS_PROFILE: "prod"
  DB_NAME: "oficina_db"
  DB_PORT: "5432"
  JWT_ISSUER: "oficina-api"
  JWT_EXPIRATION_HOURS: "8"
  # localhost:3000 mantido para validação do front rodando localmente (ng serve --port 3000)
  CORS_ALLOWED_ORIGINS: "https://oficina.example.com,http://localhost:3000"
  # Migrações rodam no start de cada pod. O Flyway serializa via advisory lock do
  # PostgreSQL, então N réplicas subindo juntas é seguro — a primeira migra e as
  # demais esperam. O padrão cloud-native seria um Job/initContainer dedicado; aqui
  # o ganho não paga a complexidade de manter uma imagem de migração à parte.
  QUARKUS_FLYWAY_MIGRATE_AT_START: "true"
  MAILER_FROM: "nao-responda@oficina.com"
  MAILER_PORT: "587"
  MAILER_START_TLS: "REQUIRED"
  # Seed de usuários: desligado por padrão (produção). O overlay hml liga para a demonstração;
  # as senhas vêm de APP_SEED_ADMIN_PASSWORD/APP_SEED_MECHANIC_PASSWORD no Secret.
  APP_SEED_ENABLED: "false"
  # Nome do ambiente (sobrescrito pelo overlay); sai como campo "env" nos logs JSON.
  APP_ENV: "prod"
  # Pool de conexões por réplica: 4 réplicas x 8 = 32, bem abaixo do teto de ~112 do db.t4g.micro.
  QUARKUS_DATASOURCE_JDBC_MAX_SIZE: "8"
  APP_SEED_ADMIN_USERNAME: "admin"
  APP_SEED_MECHANIC_USERNAME: "mecanico"

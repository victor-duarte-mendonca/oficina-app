# Segmentação de rede do namespace: nega tudo por padrão e libera só o necessário.
#
# Sem NetworkPolicy, qualquer pod do cluster alcança os pods da aplicação e o RDS
# usando a identidade de rede do node. Aqui o tráfego de entrada fica restrito ao
# ingress controller, e a saída ao DNS, ao PostgreSQL e ao SMTP.
#
# O k3s embute o controlador de NetworkPolicy (kube-router): a política vale de fato. Por isso o
# namespace newrelic precisa estar liberado para o prometheus-agent coletar /q/metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oficina-app
  namespace: oficina
spec:
  podSelector:
    matchLabels:
      app: oficina-app
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
        # Prometheus agent do New Relic (namespace newrelic): coleta /q/metrics.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: newrelic
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        # PostgreSQL (RDS) e SMTP com STARTTLS
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 587
        # HTTPS: exportador OTLP de telemetria para o New Relic. Sem esta regra, com um CNI que
        # implemente a política, a telemetria simplesmente não sairia do pod.
        - protocol: TCP
          port: 443

services:
  # ===================================================
  # PostgreSQL
  # ===================================================
  postgres:
    image: postgres:16-alpine
    container_name: oficina_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-oficina_db}
      POSTGRES_USER: ${DB_USERNAME:-oficina}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-oficina123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-oficina} -d ${DB_NAME:-oficina_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oficina_net
    restart: unless-stopped

  # ===================================================
  # Aplicação Quarkus
  # ===================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina_app
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-oficina_db}
      DB_USERNAME: ${DB_USERNAME:-oficina}
      DB_PASSWORD: ${DB_PASSWORD:-oficina123}
      JWT_ISSUER: ${JWT_ISSUER:-oficina-api}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-8}
      APP_SEED_ADMIN_PASSWORD: ${APP_SEED_ADMIN_PASSWORD:-admin123}
      APP_SEED_MECHANIC_PASSWORD: ${APP_SEED_MECHANIC_PASSWORD:-mecanico123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8080}
      JAVA_OPTS: "-Xms256m -Xmx512m"
    ports:
      - "8080:8080"
    volumes:
      # Persiste as chaves JWT entre reinicializações
      - jwt_keys:/app/keys
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/q/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
    networks:
      - oficina_net
    restart: unless-stopped

volumes:
  postgres_data:
    name: oficina_postgres_data
  jwt_keys:
    name: oficina_jwt_keys

networks:
  oficina_net:
    name: oficina_network
    driver: bridge
